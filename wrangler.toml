name = "r2-files"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Everything must go through files.bunnxr.com (behind Cloudflare Access)
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # the Worker checks Access and adds security headers before serving files

[[routes]]
pattern = "files.bunnxr.com"
custom_domain = true

# Public files and expiring share links (same Worker, no Access in front of this hostname)
[[routes]]
pattern = "r2.bunnxr.com"
custom_domain = true

# Terminal install scripts: https://u.bunnxr.com/ serves public/install/upload.sh
# or upload.ps1, picked from the User-Agent. Deploying creates the DNS record and
# attaches the hostname to this Worker.
[[routes]]
pattern = "u.bunnxr.com"
custom_domain = true

# Auto-rotation of the upload password: 04:00 UTC daily. The Worker only rotates
# when auto-rotate is on and 6 days have passed, so a rotation can land up to
# 24 hours after the 6-day mark.
# Expired short links are deleted at :30 every hour (a slice of links per run).
[triggers]
crons = ["0 4 * * *", "30 * * * *"]

# The bucket itself, as a binding. Reads of files (shared links, previews) and of the app's small
# records (.links/, .notes/, .system/) go through it, inside Cloudflare's network, instead of the
# public S3 endpoint. bucket_name must match BUCKET in src/config.js. Without this binding everything
# falls back to the S3 API, exactly as before. Listing, copies and uploads always use the S3 API.
[[r2_buckets]]
binding = "R2"
bucket_name = "fast"

# The shortener Worker's links (its LINKS namespace). Only read, never written: a file link
# may not take an address the shortener already uses on bunnxr.com.
[[kv_namespaces]]
binding = "SHORTENER_KV"
id = "d714e0bc1f154df5b8a8faa753193f85"

# Worker logs, visible under the Worker's Observability tab
[observability]
enabled = true
head_sampling_rate = 1
