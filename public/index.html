<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf8f3">
<script src="/theme.js"></script>
<meta name="robots" content="noindex,nofollow">
<title>r2 by bunnxr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='2.5%202%2035%2035'%20fill='none'%20stroke='%230f766e'%20stroke-width='3.4'%20stroke-linecap='round'%3E%3Cstyle%3E@media%20(prefers-color-scheme:dark)%7Bsvg%7Bstroke:%234fd1bf%7D%7D.e%7Btransform-box:fill-box;transform-origin:50%25%20100%25;animation:t%207s%202.5s%20infinite%7D@keyframes%20t%7B0%25,90%25,100%25%7Btransform:rotate(0)%7D93%25%7Btransform:rotate(11deg)%7D96%25%7Btransform:rotate(-4deg)%7D%7D%3C/style%3E%3Cpath%20d='M15%2024C9%2014%2011%203%2016%204C20%205%2019%2015%2019%2024'/%3E%3Cpath%20class='e'%20d='M25%2024C31%2014%2029%203%2024%204C20%205%2021%2015%2021%2024'/%3E%3Crect%20x='9'%20y='24'%20width='22'%20height='11'%20rx='5.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="r2 by bunnxr">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" id="logo"></span><h1>bunnxr</h1></div>
  <!-- Settings (gear): theme, and the edge cache for shared links. Built by renderSettings() in app.js. -->
  <div class="set">
    <button class="ib setbtn" id="setBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="setMenu" title="Settings" aria-label="Settings"></button>
    <div class="setmenu card" id="setMenu" hidden></div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <section class="card navcard">
      <button id="btnNew" class="btn primary block newbtn"><span id="newIco"></span>New</button>
      <input id="file" class="sr" type="file" multiple>
      <input id="folderInput" class="sr" type="file" webkitdirectory multiple>
      <nav id="nav" class="nav" aria-label="Browse"></nav>
    </section>
  </aside>

  <main>
    <div id="searchBar" class="card searchbar"><span id="searchIco"></span><input id="q" type="search" placeholder="Search the files" autocomplete="off" aria-label="Search the files"></div>
    <div id="resumeNote" class="note card" hidden><span id="resumeText"></span><button id="resumeDiscard" class="btn">Discard</button></div>
    <nav id="crumbs" class="crumbs" aria-label="Breadcrumb" hidden></nav>
    <!-- Connected drives: a row of drive cards (Zenith, your own server) above the file list, below the
         breadcrumb, shown at the top level of R2 only. Styles: .folders / .fcard / .f-top in style.css;
         markup + click handler: driveHtml(), renderDrives() and $('#folders') in app.js. -->
    <section id="folderSec" hidden>
      <div class="sec-h"><h2>Drives</h2></div>
      <div id="folders" class="folders"></div>
    </section>
    <section id="linksSec" hidden>
      <div class="sec-h">
        <h2>Links</h2>
        <div class="tools lk-tools">
          <span id="lkCount"></span>
          <select id="lkFilter" aria-label="Show"><option value="all">All links</option><option value="active">Active</option><option value="broken">File missing</option></select>
          <button id="lkClean" class="btn lk-wide" hidden>Clean up</button>
          <button id="lkRefresh" class="btn" title="Refresh" aria-label="Refresh"></button>
        </div>
      </div>
      <div id="lkList" class="lk-list"></div>
    </section>
    <!-- Edge cache log (#view=cache): what the Worker put in Cloudflare's cache, newest first. renderCache() in app.js. -->
    <section id="cacheSec" hidden>
      <div class="sec-h">
        <h2>Edge cache</h2>
        <div class="tools">
          <span id="ecCount"></span>
          <button id="ecClear" class="btn lk-wide" title="Delete the log (the cache itself is not touched)">Clear log</button>
          <button id="ecRefresh" class="btn" title="Refresh" aria-label="Refresh"></button>
        </div>
      </div>
      <div id="ecBody"></div>
    </section>
    <section id="upSec" hidden>
      <div class="sec-h"><h2>Uploads</h2></div>
      <div id="upBody" class="card upcard"></div>
    </section>
    <section id="filesSec">
      <div class="sec-h">
        <h2 id="filesTitle">Files</h2>
        <div class="tools">
          <span id="count"></span>
          <button id="btnSelect" class="btn" title="Select several files"></button>
          <select id="sortBy" aria-label="Sort by"><option value="name">Name</option><option value="size">Size</option><option value="date">Modified</option></select>
          <button id="sortDir" class="btn" title="Reverse order" aria-label="Reverse sort order"></button>
          <button id="btnView" class="btn" title="Switch grid / list" aria-label="Switch grid or list view"></button>
        </div>
      </div>
      <div id="trashbar" class="note card" hidden><span id="trashText"></span><button id="emptyTrash" class="btn danger">Empty trash</button></div>
      <div id="selbar" class="selbar card" hidden><span id="selCount"></span><div class="selacts"><button id="selDl" class="btn">Download zip</button><button id="selZip" class="btn">Save zip in R2</button><button id="selMove" class="btn">Move</button><button id="selCopy" class="btn">Copy</button><button id="selDel" class="btn danger">Delete</button><button id="selRestore" class="btn primary" hidden>Restore</button><button id="selPurge" class="btn danger" hidden>Delete forever</button><button id="selClear" class="btn">Clear</button><button id="selDone" class="btn">Done</button></div></div>
      <div id="list" class="list" data-view="list"></div>
    </section>
  </main>
</div>

<button class="fab" id="fab" aria-label="New"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="drop" class="drop"><div>Drop to upload<small>Files and folders go into the folder you are viewing</small></div></div>

<aside id="uploads" class="uploads card" hidden>
  <div class="u-head">
    <div><b id="upTitle">Uploads</b><small id="upSub"></small></div>
    <div><button id="upToggle" class="ib" title="Collapse"></button><button id="upClear" class="ib" title="Clear finished"></button></div>
  </div>
  <div class="u-over"><div class="meter sm"><i id="upBar"></i></div></div>
  <div id="upList" class="u-list"></div>
</aside>

<div id="job" class="job card" hidden><div class="job-h"><b id="jobTitle"></b><button id="jobCancel" class="btn">Cancel</button></div><small id="jobSub"></small><div class="meter sm"><i id="jobBar"></i></div></div>

<div id="modal" class="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This file manager needs JavaScript.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
