<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fb">
<meta name="robots" content="noindex,nofollow">
<title>r2 by bunnxr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d6efd'/%3E%3Cpath d='M9 20a4 4 0 0 1-.3-8A6 6 0 0 1 20 11a4.5 4.5 0 0 1 .5 9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" id="logo"></span><h1>Files</h1></div>
</header>

<div class="layout">
  <aside class="side">
    <section class="card navcard">
      <div class="btns">
        <label class="btn primary block" for="file"><span id="uploadIco"></span>Add file</label>
        <button id="btnFolder" class="btn block"><span id="folderIco"></span>New folder</button>
      </div>
      <input id="file" class="sr" type="file" multiple>
      <h3>My Drive</h3>
      <nav id="nav" class="nav" aria-label="Browse"></nav>
    </section>
    <section class="card store">
      <div class="big"><b id="uBig">…</b><span>used</span></div>
      <div class="sub" id="uSub"></div>
      <div class="seg" id="uSeg"></div>
      <ul id="uTypes" class="types"></ul>
    </section>
  </aside>

  <main>
    <div class="card searchbar"><span id="searchIco"></span><input id="q" type="search" placeholder="Search the files" autocomplete="off" aria-label="Search the files"></div>
    <nav id="crumbs" class="crumbs" aria-label="Breadcrumb" hidden></nav>
    <section id="folderSec" hidden>
      <div class="sec-h"><h2>Folders</h2></div>
      <div id="folders" class="folders"></div>
    </section>
    <section>
      <div class="sec-h">
        <h2 id="filesTitle">Files</h2>
        <div class="tools">
          <span id="count"></span>
          <select id="sortBy" aria-label="Sort by"><option value="name">Name</option><option value="size">Size</option><option value="date">Modified</option></select>
          <button id="sortDir" class="btn" title="Reverse order" aria-label="Reverse sort order"></button>
          <button id="btnView" class="btn" title="Switch grid / list" aria-label="Switch grid or list view"></button>
        </div>
      </div>
      <div id="list" class="list" data-view="list"></div>
    </section>
  </main>
</div>

<label class="fab" for="file" aria-label="Add file"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></label>

<div id="drop" class="drop"><div>Drop to upload<small>Files and folders go into the folder you are viewing</small></div></div>

<aside id="uploads" class="uploads card" hidden>
  <div class="u-head">
    <div><b id="upTitle">Uploads</b><small id="upSub"></small></div>
    <div><button id="upToggle" class="ib" title="Collapse"></button><button id="upClear" class="ib" title="Clear finished"></button></div>
  </div>
  <div class="u-over"><div class="meter sm"><i id="upBar"></i></div></div>
  <div id="upList" class="u-list"></div>
</aside>

<div id="modal" class="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This file manager needs JavaScript.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
