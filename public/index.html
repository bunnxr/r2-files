<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fb">
<meta name="robots" content="noindex,nofollow">
<title>r2 by bunnxr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d6efd'/%3E%3Cpath d='M9 20a4 4 0 0 1-.3-8A6 6 0 0 1 20 11a4.5 4.5 0 0 1 .5 9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="r2 by bunnxr">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" id="logo"></span><h1>r2 by bunnxr</h1></div>
</header>

<div class="layout">
  <aside class="side">
    <section class="card navcard">
      <button id="btnNew" class="btn primary block newbtn"><span id="newIco"></span>New</button>
      <input id="file" class="sr" type="file" multiple>
      <input id="folderInput" class="sr" type="file" webkitdirectory multiple>
      <nav id="nav" class="nav" aria-label="Browse"></nav>
    </section>
    <button id="usageCard" class="usage" type="button"><span class="u-ico" id="uIco"></span><span class="u-txt"><small>Storage used</small><b id="uBig">…</b><em id="uSub"></em></span><span class="u-go" id="uGo"></span></button>
  </aside>

  <main>
    <div class="card searchbar"><span id="searchIco"></span><input id="q" type="search" placeholder="Search the files" autocomplete="off" aria-label="Search the files"></div>
    <div id="resumeNote" class="note card" hidden><span id="resumeText"></span><button id="resumeDiscard" class="btn">Discard</button></div>
    <nav id="crumbs" class="crumbs" aria-label="Breadcrumb" hidden></nav>
    <section id="folderSec" hidden>
      <div class="sec-h"><h2>Folders</h2></div>
      <div id="folders" class="folders"></div>
    </section>
    <section id="linksSec" hidden>
      <div class="sec-h">
        <h2>Links</h2>
        <div class="tools lk-tools">
          <span id="lkCount"></span>
          <select id="lkFilter" aria-label="Show"><option value="all">All links</option><option value="active">Active</option><option value="expired">Expired</option><option value="broken">File missing</option></select>
          <button id="lkClean" class="btn lk-wide" hidden>Clean up</button>
          <button id="lkRefresh" class="btn" title="Refresh" aria-label="Refresh"></button>
        </div>
      </div>
      <div id="lkList" class="lk-list"></div>
    </section>
    <section id="filesSec">
      <div class="sec-h">
        <h2 id="filesTitle">Files</h2>
        <div class="tools">
          <span id="count"></span>
          <button id="btnSelect" class="btn" title="Select several files"></button>
          <select id="sortBy" aria-label="Sort by"><option value="name">Name</option><option value="size">Size</option><option value="date">Modified</option></select>
          <button id="sortDir" class="btn" title="Reverse order" aria-label="Reverse sort order"></button>
          <button id="btnView" class="btn" title="Switch grid / list" aria-label="Switch grid or list view"></button>
        </div>
      </div>
      <div id="trashbar" class="note card" hidden><span id="trashText"></span><button id="emptyTrash" class="btn danger">Empty trash</button></div>
      <div id="selbar" class="selbar card" hidden><span id="selCount"></span><div class="selacts"><button id="selDl" class="btn">Download zip</button><button id="selZip" class="btn">Save zip in R2</button><button id="selMove" class="btn">Move</button><button id="selCopy" class="btn">Copy</button><button id="selDel" class="btn danger">Delete</button><button id="selRestore" class="btn primary" hidden>Restore</button><button id="selPurge" class="btn danger" hidden>Delete forever</button><button id="selClear" class="btn">Clear</button><button id="selDone" class="btn">Done</button></div></div>
      <div id="list" class="list" data-view="list"></div>
    </section>
  </main>
</div>

<button class="fab" id="fab" aria-label="New"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="drop" class="drop"><div>Drop to upload<small>Files and folders go into the folder you are viewing</small></div></div>

<aside id="uploads" class="uploads card" hidden>
  <div class="u-head">
    <div><b id="upTitle">Uploads</b><small id="upSub"></small></div>
    <div><button id="upToggle" class="ib" title="Collapse"></button><button id="upClear" class="ib" title="Clear finished"></button></div>
  </div>
  <div class="u-over"><div class="meter sm"><i id="upBar"></i></div></div>
  <div id="upList" class="u-list"></div>
</aside>

<div id="job" class="job card" hidden><div class="job-h"><b id="jobTitle"></b><button id="jobCancel" class="btn">Cancel</button></div><small id="jobSub"></small><div class="meter sm"><i id="jobBar"></i></div></div>

<div id="modal" class="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This file manager needs JavaScript.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
